name: Build Custom Device Info (No Material)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Android Project
        run: |
          # Создаём структуру папок
          mkdir -p app/src/main/java/com/qualixxe/deviceinfo
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # Копируем иконку, если она есть в корне репозитория
          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/icon.png; fi

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DeviceInfoCustom"
          include(":app")
          EOF

          # 2. build.gradle.kts (корневой)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 3. app/build.gradle.kts (без Material Components)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.qualixxe.deviceinfo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.qualixxe.deviceinfo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          EOF

          # 4. strings.xml (название приложения)
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">My Device Info</string>
          </resources>
          EOF

          # 5. themes.xml (стандартная тема AppCompat)
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. activity_main.xml (простой LinearLayout)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Информация об устройстве"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:id="@+id/tvInfo"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:textSize="16sp"
                  android:lineSpacingExtra="8dp"
                  android:layout_marginBottom="24dp" />

              <Button
                  android:id="@+id/btnChangeBg"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Сменить фон" />

              <Space
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Made by @qualixxe096"
                  android:textSize="14sp"
                  android:textColor="#777777" />
          </LinearLayout>
          EOF

          # 8. MainActivity.kt (сбор информации + смена фона)
          cat << 'EOF' > app/src/main/java/com/qualixxe/deviceinfo/MainActivity.kt
          package com.qualixxe.deviceinfo

          import android.content.Context
          import android.graphics.BitmapFactory
          import android.graphics.drawable.BitmapDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.io.InputStream

          class MainActivity : AppCompatActivity() {
              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let {
                      try {
                          val inputStream: InputStream? = contentResolver.openInputStream(it)
                          val bitmap = BitmapFactory.decodeStream(inputStream)
                          window.setBackgroundDrawable(BitmapDrawable(resources, bitmap))
                          // Сохраняем выбор
                          getSharedPreferences("prefs", Context.MODE_PRIVATE).edit().putString("bg_uri", it.toString()).apply()
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  // Загружаем сохранённый фон, если есть
                  val prefs = getSharedPreferences("prefs", Context.MODE_PRIVATE)
                  prefs.getString("bg_uri", null)?.let { uriString ->
                      try {
                          val uri = Uri.parse(uriString)
                          val inputStream = contentResolver.openInputStream(uri)
                          val bitmap = BitmapFactory.decodeStream(inputStream)
                          window.setBackgroundDrawable(BitmapDrawable(resources, bitmap))
                      } catch (e: Exception) { e.printStackTrace() }
                  }

                  // Информация об устройстве
                  val tvInfo = findViewById<TextView>(R.id.tvInfo)
                  tvInfo.text = """
                      Модель: ${Build.MODEL}
                      Производитель: ${Build.MANUFACTURER}
                      Устройство: ${Build.DEVICE}
                      ОС: Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})
                      Процессор: ${Build.HARDWARE}
                      Ядро: ${System.getProperty("os.version")}
                  """.trimIndent()

                  findViewById<Button>(R.id.btnChangeBg).setOnClickListener {
                      pickImage.launch("image/*")
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-device-info
          path: app/build/outputs/apk/debug/app-debug.apk
