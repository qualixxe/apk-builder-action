name: Build A16 Style App (XML)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Android Project (XML Material 3)
        run: |
          mkdir -p app/src/main/java/com/qualixxe/deviceinfo
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          
          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/icon.png; fi
          
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "DeviceInfoA16"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.qualixxe.deviceinfo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.qualixxe.deviceinfo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.MyApp" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">#1E88E5</item>
                  <item name="colorSecondaryContainer">#E3F2FD</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="A16 Style"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MyApp">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal"
              android:background="@android:color/transparent">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Инфо о телефоне"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="24dp" />

              <com.google.android.material.card.MaterialCardView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  app:cardCornerRadius="32dp"
                  app:cardElevation="0dp"
                  app:cardBackgroundColor="?attr/colorSecondaryContainer"
                  android:layout_marginBottom="24dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="24dp">

                      <TextView
                          android:id="@+id/tvInfo"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textSize="16sp"
                          android:lineSpacingExtra="8dp"/>
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>

              <com.google.android.material.button.MaterialButton
                  android:id="@+id/btnBg"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="Сменить фон"
                  android:textSize="18sp"
                  app:cornerRadius="30dp" />

              <Space
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Made by @qualixxe096"
                  android:textSize="14sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/qualixxe/deviceinfo/MainActivity.kt
          package com.qualixxe.deviceinfo

          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  if (uri != null) {
                      try {
                          window.setBackgroundDrawable(android.graphics.drawable.BitmapDrawable(resources, android.provider.MediaStore.Images.Media.getBitmap(contentResolver, uri)))
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val tvInfo = findViewById<TextView>(R.id.tvInfo)
                  tvInfo.text = """
                      Модель: ${Build.MODEL}
                      Производитель: ${Build.MANUFACTURER}
                      Android: ${Build.VERSION.RELEASE}
                      Ядро: ${System.getProperty("os.version")}
                  """.trimIndent()

                  findViewById<Button>(R.id.btnBg).setOnClickListener {
                      pickImage.launch("image/*")
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a16-style-app
          path: app/build/outputs/apk/debug/app-debug.apk
