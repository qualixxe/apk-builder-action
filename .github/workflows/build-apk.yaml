name: Build A16 Style App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Generate Android Project (A16 / Material 3)
        run: |
          mkdir -p app/src/main/java/com/qualixxe/deviceinfo
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          
          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/icon.png; fi
          
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DeviceInfoA16"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.qualixxe.deviceinfo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.qualixxe.deviceinfo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          # Создаем файл темы, чтобы приложение не крашилось при запуске
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.MyApp" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="A16 Style"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MyApp">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/qualixxe/deviceinfo/MainActivity.kt
          package com.qualixxe.deviceinfo

          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              DeviceInfoScreen()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DeviceInfoScreen() {
              var backgroundUri by remember { mutableStateOf<Uri?>(null) }
              val launcher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  backgroundUri = uri
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .then(
                          if (backgroundUri != null) {
                              Modifier.background(Color.Gray)
                          } else {
                              Modifier.background(MaterialTheme.colorScheme.background)
                          }
                      )
                      .padding(20.dp)
              ) {
                  Column(
                      modifier = Modifier.fillMaxSize(),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text(
                          text = "Инфо о телефоне",
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold,
                          modifier = Modifier.padding(bottom = 24.dp),
                          color = MaterialTheme.colorScheme.onBackground
                      )

                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(32.dp))
                              .background(MaterialTheme.colorScheme.secondaryContainer)
                              .padding(24.dp)
                      ) {
                          Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              Text("Модель: ${Build.MODEL}", fontSize = 16.sp, color = MaterialTheme.colorScheme.onSecondaryContainer)
                              Text("Производитель: ${Build.MANUFACTURER}", fontSize = 16.sp, color = MaterialTheme.colorScheme.onSecondaryContainer)
                              Text("Android: ${Build.VERSION.RELEASE}", fontSize = 16.sp, color = MaterialTheme.colorScheme.onSecondaryContainer)
                              Text("Ядро: ${System.getProperty("os.version")}", fontSize = 16.sp, color = MaterialTheme.colorScheme.onSecondaryContainer)
                          }
                      }

                      Spacer(modifier = Modifier.height(20.dp))

                      Button(
                          onClick = { launcher.launch("image/*") },
                          modifier = Modifier.fillMaxWidth().height(60.dp),
                          shape = RoundedCornerShape(30.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)
                      ) {
                          Text("Сменить фон", fontSize = 18.sp)
                      }

                      Spacer(modifier = Modifier.weight(1f))

                      Text(
                          text = "Made by @qualixxe096",
                          fontSize = 14.sp,
                          color = MaterialTheme.colorScheme.onBackground,
                          modifier = Modifier.padding(bottom = 20.dp)
                      )
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: a16-style-app
          path: app/build/outputs/apk/debug/app-debug.apk
