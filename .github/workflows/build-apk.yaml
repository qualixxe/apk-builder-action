name: Build Custom Device Info

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Убрали setup-gradle, чтобы не ловить ошибку кэша GitHub
      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/qualixxe/deviceinfo
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/icon.png; fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DeviceInfoCustom"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.qualixxe.deviceinfo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.qualixxe.deviceinfo"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.activity:activity-ktx:1.8.2")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Device Info</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/icon"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FAFAFA">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="24dp"
                  android:gravity="center_horizontal">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Инфо о телефоне"
                      android:textSize="26sp"
                      android:textStyle="bold"
                      android:textColor="#000000"
                      android:layout_marginBottom="24dp" />

                  <TextView
                      android:id="@+id/tvInfo"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:textColor="#333333"
                      android:lineSpacingExtra="10dp"
                      android:layout_marginBottom="30dp" />

                  <Button
                      android:id="@+id/btnChangeBg"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Сменить фон"
                      android:padding="12dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Made by @qualixxe096"
                      android:textSize="14sp"
                      android:textColor="#888888"
                      android:layout_marginTop="40dp" />
              </LinearLayout>
          </ScrollView>
          EOF

          cat << 'EOF' > app/src/main/java/com/qualixxe/deviceinfo/MainActivity.kt
          package com.qualixxe.deviceinfo

          import android.app.ActivityManager
          import android.content.Context
          import android.graphics.BitmapFactory
          import android.graphics.drawable.BitmapDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.BatteryManager
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import java.io.InputStream

          class MainActivity : AppCompatActivity() {
              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri?.let {
                      try {
                          val inputStream: InputStream? = contentResolver.openInputStream(it)
                          val bitmap = BitmapFactory.decodeStream(inputStream)
                          window.setBackgroundDrawable(BitmapDrawable(resources, bitmap))
                          getSharedPreferences("prefs", Context.MODE_PRIVATE).edit().putString("bg_uri", it.toString()).apply()
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  // Загружаем сохраненный фон
                  val prefs = getSharedPreferences("prefs", Context.MODE_PRIVATE)
                  prefs.getString("bg_uri", null)?.let { uriString ->
                      try {
                          val uri = Uri.parse(uriString)
                          val inputStream = contentResolver.openInputStream(uri)
                          val bitmap = BitmapFactory.decodeStream(inputStream)
                          window.setBackgroundDrawable(BitmapDrawable(resources, bitmap))
                      } catch (e: Exception) { e.printStackTrace() }
                  }

                  // Сбор информации как в ShiYioo
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memoryInfo = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(memoryInfo)
                  val ramTotal = memoryInfo.totalMem / (1024 * 1024 * 1024)
                  val ramAvail = memoryInfo.availMem / (1024 * 1024 * 1024)

                  val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val batteryLevel = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)

                  val tvInfo = findViewById<TextView>(R.id.tvInfo)
                  tvInfo.text = """
                      📱 Модель: ${Build.MODEL}
                      🏭 Производитель: ${Build.MANUFACTURER}
                      ⚙️ Устройство: ${Build.DEVICE}
                      🤖 ОС: Android ${Build.VERSION.RELEASE} (API ${Build.VERSION.SDK_INT})
                      🧠 Процессор: ${Build.HARDWARE}
                      🔋 Батарея: $batteryLevel%
                      💾 RAM: $ramAvail GB / $ramTotal GB
                      🏗️ Ядро: ${System.getProperty("os.version")}
                  """.trimIndent()

                  findViewById<Button>(R.id.btnChangeBg).setOnClickListener {
                      pickImage.launch("image/*")
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-device-info
          path: app/build/outputs/apk/debug/app-debug.apk
